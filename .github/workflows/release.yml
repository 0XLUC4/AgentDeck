# Builds AgentDeck for Windows, macOS (Apple Silicon: M1 to M5) and Linux, then publishes the GitHub release.
# Trigger: push a tag `vX.Y.Z` matching the workspace version (its annotation message = release notes),
# or run manually with an existing tag (re-uploads the builds).
# Secret: TAURI_SIGNING_PRIVATE_KEY (content of ~/.tauri/agentdeck.key, no password),
# used to sign agentdeck.exe for the auto-updater (latest.json).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release (e.g. v0.2.28)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
          - name: macos-aarch64
            os: macos-latest
          - name: linux-x86_64
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Tag matches the workspace version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "v$version" = "$TAG" ] || { echo "::error::tag $TAG != Cargo.toml version $version"; exit 1; }

      - name: System libraries (GPUI, WebKitGTK, tray, audio, whisper.cpp)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build clang pkg-config \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libx11-xcb-dev libxcb1-dev \
            libvulkan-dev libfontconfig-dev libfreetype-dev libzstd-dev libssl-dev \
            libasound2-dev libdbus-1-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev libxdo-dev

      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release -p agentdeck --locked

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: mkdir -p out && cp target/release/agentdeck.exe out/

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          app=dist/AgentDeck.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" out
          cp target/release/agentdeck "$app/Contents/MacOS/"
          sed "s/__VERSION__/${TAG#v}/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          iconset=dist/AppIcon.iconset
          mkdir -p "$iconset"
          for size in 16 32 128 256 512; do
            sips -z $size $size crates/app/assets/logo.png --out "$iconset/icon_${size}x${size}.png" >/dev/null
            sips -z $((size * 2)) $((size * 2)) crates/app/assets/logo.png --out "$iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/AppIcon.icns"
          codesign --force --deep --sign - "$app"   # ad-hoc signature (required on Apple Silicon)
          ditto -c -k --keepParent "$app" out/agentdeck-macos-aarch64.zip

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/agentdeck out
          cp target/release/agentdeck dist/agentdeck/
          cp crates/app/assets/logo.png packaging/linux/com.agentdeck.app.desktop packaging/linux/install.sh dist/agentdeck/
          chmod +x dist/agentdeck/install.sh
          tar -C dist -czf out/agentdeck-linux-x86_64.tar.gz agentdeck

      - uses: actions/upload-artifact@v4
        with:
          name: agentdeck-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Sign the Windows exe (auto-updater)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || { echo "::error::secret TAURI_SIGNING_PRIVATE_KEY is missing"; exit 1; }
          npx --yes @tauri-apps/cli@2 signer sign --password "" out/agentdeck.exe

      - name: Create the release (draft) if needed
        run: |
          gh release view "$TAG" >/dev/null 2>&1 && exit 0
          # Release notes = the annotated tag message (empty for a lightweight tag).
          ref=$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" -q '.object | "\(.type) \(.sha)"')
          notes=""
          [ "${ref%% *}" = tag ] && notes=$(gh api "repos/$GH_REPO/git/tags/${ref#* }" -q .message)
          gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes "$notes"

      - name: latest.json
        run: |
          notes=$(gh release view "$TAG" --json body -q .body)
          jq -n \
            --arg version "${TAG#v}" \
            --arg notes "$notes" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg sig "$(cat out/agentdeck.exe.sig)" \
            --arg url "https://github.com/$GH_REPO/releases/download/$TAG/agentdeck.exe" \
            '{version: $version, notes: $notes, pub_date: $date,
              platforms: {"windows-x86_64": {signature: $sig, url: $url}}}' > out/latest.json
          cat out/latest.json

      - name: Upload and publish
        run: |
          gh release upload "$TAG" --clobber \
            out/agentdeck.exe out/agentdeck-macos-aarch64.zip out/agentdeck-linux-x86_64.tar.gz out/latest.json
          gh release edit "$TAG" --draft=false --latest
