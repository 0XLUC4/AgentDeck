# Linux x86_64 build. Manual run; with a tag, the archive is attached to that GitHub release.
name: linux

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the build to (empty = artifact only)"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System libraries (GPUI, WebKitGTK, tray, audio, whisper.cpp)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build clang pkg-config \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libx11-xcb-dev libxcb1-dev \
            libvulkan-dev libfontconfig-dev libfreetype-dev libzstd-dev libssl-dev \
            libasound2-dev libdbus-1-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev libxdo-dev

      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Check (fast failure)
        run: cargo check -p agentdeck --locked

      - name: Build release
        run: cargo build --release -p agentdeck --locked

      - name: Package
        run: |
          mkdir -p dist/agentdeck
          cp target/release/agentdeck dist/agentdeck/
          tar -C dist -czf agentdeck-linux-x86_64.tar.gz agentdeck

      - uses: actions/upload-artifact@v4
        with:
          name: agentdeck-linux-x86_64
          path: agentdeck-linux-x86_64.tar.gz

      - name: Attach to release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" agentdeck-linux-x86_64.tar.gz --clobber
