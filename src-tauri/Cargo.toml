[package]
name = "agentdeck"
version = "0.1.4"
description = "Multi-agent terminal dashboard"
authors = ["Luca"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "agentdeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tauri-plugin-store = "2.5.0"
tauri-plugin-notification = "2.7.0"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-dialog = "2.8.3"
toml_edit = "0.25.17"
portable-pty = "0.9.0"
tiny_http = "0.12.0"
cpal = "0.18.2"
uuid = { version = "1.29.0", features = ["v4"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "blocking", "multipart", "json"] }
whisper-rs = "0.16.0"
keyring = { version = "4.2.0", default-features = false, features = ["windows-native-keyring-store", "v1"] }
tauri-plugin-updater = "2.14.0"
tauri-plugin-process = "2.4.0"
tauri-plugin-autostart = "2.7.0"
chrono = "0.4.45"
ruzstd = "0.9.1"

[features]
# Vulkan GPU backend for local transcription (needs the Vulkan SDK at build time).
gpu = ["whisper-rs/vulkan"]


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
