[package]
name = "agentdeck-core"
version.workspace = true
edition.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml_edit = "0.25.17"
portable-pty = "0.9.0"
tiny_http = "0.12.0"
cpal = "0.18.2"
uuid = { version = "1.29.0", features = ["v4"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "blocking", "multipart", "json"] }
whisper-rs = "0.16.0"
keyring = { version = "4.2.0", default-features = false, features = ["windows-native-keyring-store", "v1"] }
chrono = "0.4.45"
ruzstd = "0.9.1"
dirs = "6"
# Shortcut string parsing/validation only ("Ctrl+Shift+Space"); registration lives in the app.
global-hotkey = "0.8.0"
regex = "1"
unicode-normalization = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Com", "Win32_System_JobObjects", "Win32_System_Threading"] }

[features]
# Vulkan GPU backend for local transcription (needs the Vulkan SDK at build time).
gpu = ["whisper-rs/vulkan"]
