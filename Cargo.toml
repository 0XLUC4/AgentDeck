[workspace]
resolver = "2"
members = ["crates/core", "crates/app"]

[workspace.package]
version = "0.2.22"
edition = "2024"
authors = ["Luca"]

[workspace.dependencies]
agentdeck-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

# Local fix: skips re-sending unchanged bounds/visibility to WebView2 on every frame (lag, flicker).
[patch.crates-io]
gpui-webview = { path = "vendor/gpui-webview" }
# Local fix: one frame of latency instead of three (laggy mouse, see DirectXRendererDevices::new).
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }
